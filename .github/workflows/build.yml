name: package

# Build .deb + .rpm for MiniMax Code from the upstream macOS DMG and publish
# them to a GitHub Release tagged minimax-code-v<version>.
#
# MiniMax ships TWO separate editions of the desktop app:
#   cn        agent.minimax.cn   (com.minimax.agent.cn, Chinese UI)
#   overseas  agent.minimax.io   (com.minimax.agent, English UI)
# They are different payloads (app.asar ships a different .env.local), so each
# edition is built from its own upstream DMG and published as its own package
# and release tag:
#   cn        minimax-code-v<version>              minimax-code_*.deb
#   overseas  minimax-code-global-v<version>       minimax-code-global_*.deb
# The two packages have distinct names, so they can be installed side by side.
#
# Triggers:
#   - workflow_dispatch: build one explicit version. Pass a DMG URL to point at
#     a fetchable DMG; if omitted, packaging/resolve-version.sh resolves it
#     (works once MiniMax publishes a latest-mac.yml at their electron-updater
#     URL). Use the region input to build a single edition.
#   - schedule (every 6h): discover the latest upstream version; if any
#     edition of it is not yet released, dispatch a build for it. (workflow_
#     dispatch is the one event the GITHUB_TOKEN may trigger recursively.)
#
# Note: as of writing, MiniMax has not published latest-mac.yml at
# https://filecdn.minimax.chat/public/minimax-agent-prod/release, so scheduled
# discovery no-ops until they do; use workflow_dispatch + a DMG URL in the
# meantime.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Upstream version, e.g. 3.0.43"
        required: true
        type: string
      region:
        description: "Edition(s) to build"
        required: false
        default: both
        type: choice
        options:
          - both
          - cn
          - overseas
      dmg_url_cn:
        description: "Direct DMG URL for the CN edition (optional; auto-resolved if omitted)"
        required: false
        type: string
      dmg_url_overseas:
        description: "Direct DMG URL for the global edition (optional; auto-resolved if omitted)"
        required: false
        type: string
  schedule:
    - cron: "23 */6 * * *"

permissions:
  contents: write
  actions: write

jobs:
  discover:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Discover new upstream version and dispatch a build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          if ! out="$(MMX_REGION=cn ./packaging/resolve-version.sh 2>/dev/null)"; then
            echo "No resolvable upstream version yet (latest-mac.yml not published); skipping."
            exit 0
          fi
          ver="$(printf '%s\n' "$out" | sed -n '1p')"
          [ -n "${ver:-}" ] || exit 0
          echo "Latest MiniMax Code: $ver"
          for region in cn overseas; do
            tag="$(MMX_REGION="$region" bash -c \
              '. ./scripts/lib_common.sh >/dev/null 2>&1; printf "%s%s" "$MMX_RELEASE_TAG_PREFIX" "$1"' _ "$ver")"
            if gh release view "$tag" -R "${{ github.repository }}" >/dev/null 2>&1; then
              echo "$tag already released."
            else
              echo "Missing release: $tag"
              gh workflow run build.yml -R "${{ github.repository }}" \
                -f version="${ver}" -f region="${region}"
            fi
          done

  build:
    if: github.event_name == 'workflow_dispatch' && (inputs.region == 'both' || inputs.region == matrix.region)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        region: [cn, overseas]
    env:
      MMX_REGION: ${{ matrix.region }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '24' }
      - uses: actions/setup-go@v5
        with: { go-version: '1.26' }

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq p7zip-full perl file python3
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Resolve DMG URL
        id: dmg
        env:
          DMG_URL_CN: ${{ inputs.dmg_url_cn }}
          DMG_URL_OVERSEAS: ${{ inputs.dmg_url_overseas }}
        run: |
          set -uo pipefail
          if [ "$MMX_REGION" = "cn" ]; then
            url="${DMG_URL_CN:-}"
          else
            url="${DMG_URL_OVERSEAS:-}"
          fi
          if [ -z "$url" ]; then
            out="$(./packaging/resolve-version.sh)"
            url="$(printf '%s\n' "$out" | sed -n '2p')"
            [ -n "$url" ] || { echo "Could not resolve DMG URL" >&2; exit 1; }
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Build packages
        env:
          PRODUCT_VERSION: ${{ inputs.version }}
          DMG_URL: ${{ steps.dmg.outputs.url }}
        run: ./packaging/build.sh

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: packages-${{ matrix.region }}
          path: dist/
          if-no-files-found: error
          retention-days: 14

  release:
    needs: build
    # always(): the two editions are built and published independently, so one
    # edition failing must not stop the other from being released.
    if: always() && needs.build.result != 'cancelled' && needs.build.result != 'skipped' && (inputs.region == 'both' || inputs.region == matrix.region)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        region: [cn, overseas]
    env:
      VER: ${{ inputs.version }}
      MMX_REGION: ${{ matrix.region }}
    steps:
      - uses: actions/checkout@v4
      - name: Download package artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: packages-${{ matrix.region }}
          path: dist
          merge-multiple: true
      - name: Create or update release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          . ./scripts/lib_common.sh
          TAG="${MMX_RELEASE_TAG_PREFIX}${VER}"
          case "$MMX_REGION" in
            cn)
              EDITION="MiniMax Code (CN edition, agent.minimax.cn)" ;;
            overseas)
              EDITION="MiniMax Code (global edition, agent.minimax.io)" ;;
          esac
          {
            echo "MiniMax Code ${VER} — unofficial Linux packages"
            echo
            echo "Edition: ${EDITION}"
            echo
            echo "Repackaged from MiniMax's official macOS build. MiniMax Code is (c) MiniMax;"
            echo "this project only rewraps the upstream binaries for Linux. See NOTICE.md."
            echo
            echo "## Install"
            echo '```bash'
            for f in dist/*.deb; do echo "sudo apt install ./$(basename "$f")     # Debian/Ubuntu"; done
            for f in dist/*.rpm; do echo "sudo dnf install ./$(basename "$f")    # Fedora/RHEL"; done
            echo '```'
            echo
            echo "## Assets"
            for f in dist/*.deb dist/*.rpm dist/checksums_*; do echo "- \`$(basename "$f")\`"; done
          } > /tmp/notes.md

          if gh release view "$TAG" -R "${{ github.repository }}" >/dev/null 2>&1; then
            echo "Release $TAG exists; uploading/clobbering assets."
            gh release upload "$TAG" dist/*.deb dist/*.rpm dist/checksums_* \
              -R "${{ github.repository }}" --clobber
          else
            gh release create "$TAG" dist/*.deb dist/*.rpm dist/checksums_* \
              -R "${{ github.repository }}" \
              --title "MiniMax Code ${VER} (unofficial)" \
              --notes-file /tmp/notes.md
          fi
